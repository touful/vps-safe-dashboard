# sentry-agent 部署模板（docker compose，方案 6.4.2 参数落地）
# 用法：docker compose -f deploy/docker-compose.yml up -d
# 前置：已按部署手册完成宿主环境检查（deploy/check_env.sh）与 fail2ban 安装/防火墙规则配置
services:
  sentry-agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sentry-agent:latest
    container_name: sentry-agent
    restart: unless-stopped
    # 网络：必须 host（共享宿主网络命名空间，conntrack 事件可见性前提，方案 6.4.2）
    network_mode: host
    # capability 最小化（VS-13，AUD-VPS-001 P2-2 / DEV-VPS-001 C1）：
    # cap_drop ALL 去除 Docker 默认 14 项 cap（NET_RAW/SYS_CHROOT/MKNOD/AUDIT_WRITE 等），
    # 仅保留 NET_ADMIN——conntrack netlink 组播订阅所需（方案 6.4.2 调研结论；
    # 纯 NET_ADMIN 下 conntrack 行为由复验清单 V-03 覆盖验证）
    # DEV-HONEY-001：蜜罐启用时（honeypot.enabled=true）标准低端口（21/23/445/1433/3389）
    # 需 NET_BIND_SERVICE 才能以非 root 绑定（<1024 端口）——cap_add 追加后
    # user 1000:1000 可绑定低端口；未启用蜜罐时该 cap 无实际作用（低风险 cap，
    # 审计 VS-13 最小化原则下已评估：NET_BIND_SERVICE 仅放宽端口绑定面，
    # 容器网络为 host 模式且进程不监听额外端口，不引入新的攻击面）。
    # 备选方案（不推荐）：将 user 改为 root 运行（失去 VS-13 纵深防御）。
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
    user: "1000:1000"
    # 日志组补充：读取宿主 journal（C-12 检查后按实际 GID 调整）
    # group_add:
    #   - "998"   # systemd-journal GID（以宿主 getent group systemd-journal 为准）
    volumes:
      # 数据卷（rw）
      - /var/lib/sentry-agent:/var/lib/sentry-agent
      # 只读挂载：journal 目录——挂载到容器内代码默认路径 /var/log/journal
      # （R-01 修订：容器内 journalctl 读默认路径，宿主 journal 覆盖挂载）
      - /var/log/journal:/var/log/journal:ro
      # 只读挂载：machine-id（journalctl 读取 journal 文件的 machine-id 匹配）
      - /etc/machine-id:/etc/machine-id:ro
      # 只读挂载：fail2ban 日志与库（方案 6.5.4 步骤 4 ACL 后）
      - /var/log/fail2ban.log:/host/fail2ban.log:ro
      - /var/lib/fail2ban/fail2ban.sqlite3:/host/fail2ban.sqlite3:ro
      # 配置（只读）
      - /etc/sentry-agent/config.json:/etc/sentry-agent/config.json:ro
    environment:
      - TZ=Asia/Shanghai
    # F-03（DEV-009）：纵深防御——内存上限 + no-new-privileges
    mem_limit: 256m
    # VS-13（AUD-VPS-001 P2-2 / DEV-VPS-001 C1）：CPU 上限 0.8 核——1C1G 留余量，
    # 防止 30d 聚合查询等重查询打满宿主单核（mem_limit 已兜底内存，CPU 由 cpus 约束；
    # 任务书指定 0.8，高于审计 VS-13 建议值 0.5，以任务书为准）
    cpus: "0.8"
    # VS-13（AUD-VPS-001 P2-2 / DEV-VPS-001 C2）：rootfs 只读——防容器持久性写入。
    # 评估结论（DEV-P1-002）：静态二进制（CGO_ENABLED=0）+ journalctl/ss/tail 均为读操作，
    # SQLite 数据写入全部落在 /var/lib/sentry-agent（rw 卷，WAL/-wal/-shm 同目录）；
    # tmpfs 补偿：/tmp 兜底 SQLite 排序临时文件与子进程运行时临时需求，
    # /home/sentry 兜底 USER sentry 的 HOME 写尝试（如 sd_journal cache），
    # 合计约 17MB 内存开销（16m+1m）。运行时行为由复验清单 read_only/tmpfs 项闭环验证。
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /home/sentry:size=1m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
